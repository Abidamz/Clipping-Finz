<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipping Playbook — Zero to First Payout</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#141822; --panel2:#1b2030; --line:#252c3d;
    --text:#e8ecf5; --muted:#8b95ad; --accent:#3ddc97; --accent2:#5b8cff;
    --warn:#ffb44d; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  @media(max-width:820px){.shell{grid-template-columns:1fr}}

  aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 16px 40px;
    height:100vh;overflow:auto;position:sticky;top:0}
  @media(max-width:820px){aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
  aside h1{font-size:16px;margin:0 0 2px}
  aside .tag{color:var(--muted);font-size:12px;margin-bottom:14px}
  .prog{height:8px;background:#0f131c;border-radius:99px;border:1px solid var(--line);overflow:hidden}
  .prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .3s}
  .progTxt{font-size:12px;color:var(--muted);margin:6px 0 16px}
  .mod{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
  .navbtn{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);
    font:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;cursor:pointer;line-height:1.35}
  .navbtn:hover{background:var(--panel2)}
  .navbtn.on{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent2)}
  .navbtn.done{color:var(--muted)}
  .navbtn.done::after{content:" ✓";color:var(--accent)}

  main{padding:28px 32px 80px;max-width:760px}
  @media(max-width:600px){main{padding:20px 16px 60px}}
  .crumb{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent2);margin-bottom:6px}
  h2{font-size:24px;margin:0 0 6px;line-height:1.25}
  .goal{color:var(--muted);font-size:14px;margin-bottom:22px}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 0 10px}
  ol.steps{margin:0;padding-left:20px}
  ol.steps li{margin:11px 0}
  ol.steps li b{color:#fff}
  .box{border-radius:10px;padding:13px 15px;font-size:13.5px;margin:18px 0;line-height:1.55}
  .drill{background:#0f1620;border-left:3px solid var(--accent2)}
  .drill .lbl{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent2);margin-bottom:5px}
  .warnbox{background:#1a1508;border-left:3px solid var(--warn)}
  .warnbox .lbl{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--warn);margin-bottom:5px}
  .badbox{background:#1c0f13;border-left:3px solid var(--bad)}
  .badbox .lbl{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--bad);margin-bottom:5px}
  .src{font-size:12px;color:var(--muted);margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  pre{background:#0f131c;border:1px solid var(--line);border-radius:9px;padding:12px;
    overflow:auto;font-size:12.5px;line-height:1.5;margin:10px 0}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .row{display:flex;gap:9px;align-items:center;margin-top:30px;flex-wrap:wrap}
  button.btn{background:var(--accent2);border:0;border-radius:9px;padding:10px 16px;
    font:inherit;font-weight:600;color:var(--text);cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:10px 16px;font:inherit;cursor:pointer}
  button.done{background:var(--accent);color:#06110c}
  .muted{color:var(--muted);font-size:12.5px}
  ul.plain{margin:8px 0;padding-left:18px;font-size:13.5px}
  ul.plain li{margin:6px 0}
  a{color:var(--accent2)}
</style>
</head>
<body>
<div class="shell">

<aside>
  <h1>Clipping Playbook</h1>
  <div class="tag">Zero to first payout · 30 lessons</div>
  <div class="prog"><i id="pbar"></i></div>
  <div class="progTxt" id="ptxt">0 of 30 complete</div>
  <div id="nav"></div>
</aside>

<main id="main"></main>

</div>

<script>
const KEY = 'clipdrops.course.v1';

const MODULES = [
  {
    title: 'Module 1 · Orientation',
    lessons: [
      {
        id: 'l1',
        title: 'What clipping actually pays for',
        goal: 'Understand the transaction before you spend a single hour on it.',
        steps: [
          '<b>Clipping is distribution, not content creation.</b> A brand or creator has footage and wants reach. You cut it into short vertical clips and post them. They pay per 1,000 views the post earns.',
          '<b>The unit is CPM — cost per mille, i.e. per thousand views.</b> Rates run roughly $0.40 to $3.00 per 1K across platforms. Gaming and crypto campaigns sit at the top of that range; generic brand campaigns cluster around $1.',
          '<b>You are not paid for the edit. You are paid for the view.</b> That means you can do everything right and still earn nothing if the hook does not land. This is the central risk of the model and no tutorial will remove it.',
          '<b>There is no audience requirement.</b> New accounts can earn. What matters is whether the platform pushes the clip, and the platform decides that in the first two seconds.',
          '<b>Your first job is not to learn editing software.</b> It is to learn which 3 seconds of a 60-second video will stop a thumb. That is a different skill and it is free to practise.'
        ],
        drill: 'Open any social feed. Count how many videos you scroll past before one stops you, and note what stopped you — a face, a number, motion, a claim. Write down five. That list is your first hook bank.',
        warn: 'Anyone quoting you a fixed monthly figure is selling. The numbers in the threads you saved ($26,403/month, "$6K in 90 days", "$1.6K in two months") are self-reported, unverifiable, and usually attached to something for sale.',
        source: 'Primal thread (CPM mechanics, no-face-needed); Netokrypto (self-reported $1.6K in ~2 months on Content Rewards); Maran thread (rate ranges across platforms).'
      },
      {
        id: 'l2',
        title: 'The honest ceiling, in numbers',
        goal: 'Know what a good month and a bad month look like before you plan your rent around either.',
        steps: [
          '<b>Do the arithmetic once and then stop.</b> $2.00 per 1K views = $2 for 1,000 views = $20 for 10,000 views. Your ₦2,000,000 target is roughly $1,300 at ₦1,500/$ — about <b>650,000 TikTok views</b> across the month, or around 22,000 a day.',
          '<b>That is not a beginner month.</b> It is a sustained-hit month. Most people who post daily for 30 days land somewhere between ₦120,000 and ₦600,000, and a real number of them land at ₦0 because a clip got rejected or never accumulated views.',
          '<b>Per-platform caps exist.</b> Many campaigns cap payouts per clip (the MW4 campaign caps at $1,200 per platform) and per account. You cannot walk one viral clip to the target.',
          '<b>Minimum thresholds cut both ways.</b> If a campaign pays from $6 (about 3,000 views), small clips still count. If a campaign only pays above 100,000 views, a 40,000-view clip is worth exactly nothing.',
          '<b>The reliable money is boring.</b> Client editing — a person pays you a fixed price for a fixed number of clips — does not depend on the algorithm at all. That is why the console splits your target into campaigns (₦500k) and client work (₦1.5m).'
        ],
        drill: 'Open the console Calculator tab. Set the rate to your campaign\u2019s real rate and the target to your honest goal for 30 days, not the wedding number. Note how many views a day that needs. If the number makes you uncomfortable, that is the correct response.',
        warn: 'Do not build a plan that only works if one clip goes viral. Build a plan that survives if none do — that means client work running in parallel from week two.',
        source: 'Maran (rate ranges and thresholds); campaign brief for MW4 DMZ ($2.00/1K TikTok, $1.50/1K Instagram, $6 and $4.50 minimums).'
      },
      {
        id: 'l3',
        title: 'Pick one lane and stay in it',
        goal: 'Choose a niche you can source footage for weekly without permission problems.',
        steps: [
          '<b>One niche, two platforms.</b> The threads all agree on this and they are right: two campaigns in one vertical beats ten joined at once. Focused accounts get pushed to focused audiences.',
          '<b>Choose based on source supply, not passion.</b> Ask: can I get legally clip-able footage every week? Official game campaigns, creator-submitted footage, podcasts that invite clipping, and brand campaigns all have clear permission. Random YouTube videos do not.',
          '<b>Gaming is the best starting lane if you are in a campaign</b> — the footage is provided, the rights are settled, the payout rate is high, and you do not need to appear on camera.',
          '<b>Check the creator is not banned on your target platform.</b> If they are, your clips inherit the problem and get suppressed before you post. Verify the account exists and posts normally.',
          '<b>Your page name should survive a pivot.</b> A name like <span class="mono">codclipsng</span> locks you to one game and one country. A name like <span class="mono">clipdropsonly</span> does not.'
        ],
        drill: 'Write down three candidate niches. For each, name the exact source of clip-able footage and the campaign or permission that covers it. If you cannot name the source in one sentence, cross it off.',
        warn: '"No permission needed, it is fair use" is not a legal position you should rely on when the money is real. Campaign footage comes with permission. Everything else is a judgement call with a takedown risk.',
        source: 'Maran ("pick 2 in one niche"); Primal (no face, no audience needed); Luka (check whether the creator is banned on the platform you post to).'
      }
    ]
  },
  {
    title: 'Module 2 · Set up like a page that lasts',
    lessons: [
      {
        id: 'l4',
        title: 'Page identity',
        goal: 'Look like a media account, not a personal account with clips bolted on.',
        steps: [
          '<b>Name field and handle do different jobs.</b> The name field (<span class="mono">CLIP DROPS</span>) is what search matches and what reads well in a caption. The handle (<span class="mono">@clipdropsonly</span>) is what you can still get. Set both.',
          '<b>Match the avatar and banner.</b> Logo avatar, banner wordmark, same two colours. Your branding assets are already in the repo — <span class="mono">branding/pfp.png</span> and <span class="mono">branding/banner.png</span>.',
          '<b>Bio states what you post, then how to reach you.</b> Three lines maximum. End with "DM for collabs" — that single line is how client work finds you, and client work is the part of the plan that does not depend on luck.',
          '<b>No campaign language in the bio.</b> Never "sponsored", never "#Ad". Disclosure belongs on each post. A bio that announces advertising reads as a page that will post ads, which suppresses it.',
          '<b>Set the account to a creator/ professional category</b> (Digital Creator). It unlocks analytics, which you need for the testing module later.'
        ],
        drill: 'Fill the name, handle, avatar, banner and all three bio lines before you post anything. Then look at the profile on a phone, not a desktop — that is how a stranger will see it.',
        warn: 'Do not link to anything you would not want a brand to open. One link, and only when you have something worth sending (a portfolio or a WhatsApp).',
        source: 'TPurity (username matches niche, clean pic, bio that protects you); Luka (professional account, Digital Creator).'
      },
      {
        id: 'l5',
        title: 'Which platforms, in what order',
        goal: 'Pick two platforms and stop there for the first 30 days.',
        steps: [
          '<b>TikTok first</b> if the campaign pays best there and the footage is short-form native. It has the fastest cold-start distribution of any platform — a brand-new account can hit 100k views.',
          '<b>Instagram Reels second.</b> Lower rate on the MW4 campaign ($1.50 vs $2.00 per 1K) but you reuse the identical file, so the second platform costs you one upload, not one edit.',
          '<b>YouTube Shorts third, only if a campaign allows it.</b> Slower to start, longer tail. Worth it for evergreen footage, not worth splitting your attention in week one.',
          '<b>X is a different game.</b> Clipping on X pays well and native clips credit the creator automatically, but the paying campaigns there are mostly crypto and the audience behaves differently. Do not mix it into your first 30 days.',
          '<b>Post the same file to both.</b> No re-export per platform, and no platform-specific watermark — ever.'
        ],
        drill: 'Rank TikTok, Instagram, YouTube and X by (1) campaign rate, (2) how fast you can make an account that will not be flagged, (3) how much you personally use it. Post to the top two only.',
        warn: 'Watermarked reposts are the fastest route to a rejected submission. TikTok watermarks on an Instagram Reel read as stolen content to both the algorithm and the campaign reviewer.',
        source: 'Primal (open only the accounts the campaign allows); Maran (platform-specific campaign boards); MW4 campaign brief (TikTok and Instagram rates).'
      },
      {
        id: 'l6',
        title: 'Warming up a new account',
        goal: 'Avoid the trap where every clip you post caps at 200 views.',
        steps: [
          '<b>Do not post on day one.</b> A brand-new account that starts uploading clips immediately looks like a bot to the algorithm. Five days of normal use costs you nothing and is the single highest-leverage wait in this course.',
          '<b>Day 1:</b> scroll 30–60 minutes in your niche. Watch clips to the end, like a few, follow a handful of accounts.',
          '<b>Day 2:</b> scroll, like, save, and share one or two clips.',
          '<b>Day 3:</b> comment once or twice, follow more niche accounts, post a story.',
          '<b>Days 4–5:</b> repeat day 3. By day 5 the account has a behavioural history and the algorithm knows roughly who to show it to.',
          '<b>The signal it worked:</b> on Instagram, you start getting follows before you have posted anything. That means the account is being treated as a real user.'
        ],
        drill: 'Set a 5-day countdown on your phone. Log each day in the console Clips tab notes. Post nothing until day 5 ends.',
        warn: 'The claim that five days of scrolling "unlocks" higher reach is folklore, not documented platform behaviour. What is documented is that brand-new accounts posting identical-looking content on day one get throttled. The wait is cheap insurance, not a guarantee.',
        source: 'Luka (detailed 5-day routine); Primal (do not create an account and post immediately).'
      },
      {
        id: 'l7',
        title: 'Device hygiene, and the line not to cross',
        goal: 'Keep accounts from being linked to each other, without breaking platform rules or campaign terms.',
        steps: [
          '<b>One phone for clipping.</b> Not because you are hiding anything, but because stacking many accounts on one device with one IP posting all day is a recognisable bot pattern, and you will lose accounts for it.',
          '<b>Keep the device otherwise normal.</b> Real apps, real scrolling, no automation tools, no bulk schedulers that post identical content across accounts.',
          '<b>Never buy views, followers, or engagement.</b> Every platform named in these threads verifies views before paying, and purchased views fail verification. You lose the payout and the account.',
          '<b>Never use a VPN or proxy to fake a country.</b> Campaigns pay on the audience\u2019s country data. Spoofed locations either produce "no country data" — which pays nothing — or trip fraud screening. This is the single most expensive piece of advice in the threads you saved.',
          '<b>Never run accounts you did not make, or share logins with a "campaign manager".</b> No legitimate campaign needs your password.'
        ],
        drill: 'Audit what you already have installed: any auto-poster, any view-bot, any VPN set to another country. Remove them before you post. Write down the one phone you will use.',
        warn: 'Two of your saved threads teach location spoofing — ordering a foreign SIM, a paid VPN, disabling location services, and setting the phone to another country. That is a ToS violation on every platform involved, and it specifically breaks the campaign rule you are working under. Skip it. Your campaign pays Nigerian views.',
        source: 'Luka (burner phone, one account per device); Wealth_Tactics_ (free proxy + location spoofing) and Luka (foreign SIM + paid VPN) — both rejected here, see the "Cut list" page.'
      }
    ]
  },
  {
    title: 'Module 3 · Find campaigns that actually pay',
    lessons: [
      {
        id: 'l8',
        title: 'Where the campaigns live',
        goal: 'Know the boards, the typical rates, and which ones let you withdraw small amounts.',
        steps: [
          '<b>Content Rewards</b> (run on Whop) — the biggest board, most agency campaigns, typically $1–$1.25 per 1K, withdraw from about $1. Sign up as a Creator, then use Discover.',
          '<b>Whop</b> is the payout rail for Content Rewards and many agencies. Nigerian bank withdrawal is supported. You need this account even if you join campaigns elsewhere.',
          '<b>Vyro</b> — roughly $1–$2.50 per 1K, weekly payouts, $10 minimum. <b>Clipster</b> — median about $1, biggest campaign board. <b>Clipping.net</b> — $0.40–$3, large brand campaigns.',
          '<b>Clipping Culture</b> is the board your MW4 DMZ campaign sits on. It pays at the top of the range for gaming and does not require a dedicated page.',
          '<b>Trapster</b> for game studios specifically (studios set the CPM, Stripe payouts). <b>Clipur</b> and <b>Promote.fun</b> are X/Twitter and crypto-oriented — different skill set, ignore for now.'
        ],
        drill: 'Create Content Rewards and Whop accounts today. Browse Discover without joining anything. Note the three campaigns with the highest rate that your accounts are eligible for.',
        warn: 'Rates in this lesson come from a third-party thread and change per campaign. Always read the live brief — the number in a tweet is not the number you will be paid.',
        source: 'Maran thread (rates, minimums, board list); Primal (Content Rewards + Whop signup flow); Clipping Culture (MW4 campaign).'
      },
      {
        id: 'l9',
        title: 'Read the brief like a contract',
        goal: 'Stop failing the review stage, which is where most beginners actually lose money.',
        steps: [
          '<b>Extract five facts before you cut anything:</b> the rate, the payout cap, the minimum threshold, the platforms allowed, and the required tags and disclosure.',
          '<b>Then extract the restrictions:</b> what footage is permitted, whether watermarks are banned, whether the caption must be original, whether a specific page or account type is required, and what counts as an invalid view.',
          '<b>Check the remaining budget.</b> A campaign with a great rate and $200 left is a campaign that will run dry before your clips accrue. Budget-left is as important as rate.',
          '<b>Check the country rules.</b> Find out whether your own audience counts. If Nigeria is not excluded, your views pay. If a campaign is US-only, no amount of editing changes your audience.',
          '<b>Write the five facts into the console before you post.</b> Then re-read the brief after editing and before submitting — the second read is where people catch the tag they forgot.'
        ],
        drill: 'Take the MW4 campaign brief and write its five facts on paper: rate per platform, cap, minimum, platforms, required tags. Tape it where you edit.',
        warn: '"Most people do not fail because they cannot edit. They fail because they did not read." That line from the Primal thread is the most useful sentence in everything you saved.',
        source: 'Primal (step 4: read the requirements, twice); Maran (read the brief or be disqualified; check budget left).'
      },
      {
        id: 'l10',
        title: 'Payout traps',
        goal: 'Recognise the four structures that turn views into nothing.',
        steps: [
          '<b>The high threshold.</b> Some campaigns only pay above 100,000 views per clip. Your 40k-view clip earns zero, not partial. Never join a threshold campaign as your first.',
          '<b>The unverified view.</b> Views get filtered for bots, repeats, and missing country data. A post showing 80,000 views can settle at 55,000 verified. Plan on a haircut, not the raw number.',
          '<b>The cap.</b> Per-clip and per-account caps mean a viral hit stops earning at the ceiling. Multiple distinct clips beat one enormous one.',
          '<b>The disappearing budget.</b> Campaigns close when the budget is spent. Submit early in the campaign, not in week four.',
          '<b>The unpaid labour.</b> If a campaign asks you to pay to join, buy a "starter pack", or recruit others to unlock payment, it is not a campaign. It is a scheme.'
        ],
        drill: 'For your current campaign, write the settlement maths: views × rate ÷ 1000, minus the assumed 30% verification haircut. Compare that with the cap. That is your realistic per-clip ceiling.',
        warn: 'Treat every payout as zero until the money is in your account. Log the views, but do not spend the naira.',
        source: 'Maran ("every one of these verifies before paying"); campaign terms on caps and country data.'
      },
      {
        id: 'l11',
        title: 'Choosing two, not ten',
        goal: 'Commit to a portfolio you can actually service daily.',
        steps: [
          '<b>Two campaigns maximum for the first 30 days.</b> One where you already have footage and rights, one spare with a similar audience so you can cross-post the same edits.',
          '<b>Prefer campaigns with a low minimum and no cap</b> while you are learning. You want volume feedback, not a lottery ticket.',
          '<b>Check that the same clip can serve both</b> — if two campaigns want the same niche, the same footage, and different tags, you are doubling output per edit.',
          '<b>Leave the rest bookmarked.</b> Write them down with their rates so you can rotate when one budget runs dry. There is no penalty for joining late; there is a penalty for joining ten and servicing none.'
        ],
        drill: 'Write your two campaigns on one line each, with rate, cap, minimum and tags. Add them to the console notes. Delete every other tab.',
        warn: 'Multi-campaign spreading is how people post 60 mediocre clips and blame the algorithm. Fewer campaigns, more repetitions per format.',
        source: 'Maran ("do not join 10 at once, pick 2 in one niche and post daily").'
      }
    ]
  },
  {
    title: 'Module 4 · Cutting a clip that survives a phone screen',
    lessons: [
      {
        id: 'l12',
        title: 'The vertical crop',
        goal: 'Get from a 16:9 source to a 1080×1920 clip without killing the composition.',
        steps: [
          '<b>Centre-crop is the default.</b> Taking the middle 9:16 slice of the frame works when the subject is centred. Most campaign footage is composed centre-heavy for exactly this reason.',
          '<pre>ffmpeg -y -ss 00:00:33 -to 00:00:45 -i "source.mp4" -vf "crop=ih*9/16:ih,scale=1080:1920,setsar=1" -c:v libx264 -preset medium -crf 20 -r 30 -c:a aac -b:a 192k clip3.mp4</pre>',
          '<b>Shift the crop when the subject is off-centre.</b> <span class="mono">crop=ih*9/16:ih:x:0</span> — raise <span class="mono">x</span> to push the window right. Test one frame before encoding the whole clip.',
          '<b>Blurred pad when the frame cannot be cropped</b> — wide shots, text, logos, end cards: scale the image to fit the width, blur a filled background behind it. Nothing gets cut off.',
          '<b>Check a still frame from every clip</b> before you post. Crops that look fine in a scrubbing timeline look broken at phone size in the dark.'
        ],
        drill: 'Export four clips from one source: two centre-crop, one shifted crop, one blurred pad. Look at all four on your actual phone, not the laptop. Keep the two that read best.',
        warn: 'Dark or silhouette-heavy footage usually fails a vertical crop — the subject ends up as a black smear. Change the segment rather than fighting the crop.',
        source: 'Working method from this project; validated against the MW4 briefing export.'
      },
      {
        id: 'l13',
        title: 'On-screen text and the hook',
        goal: 'Make the first frame stop a scroll.',
        steps: [
          '<b>Three to six words maximum.</b> "NEW DMZ MAP" works. "Check out this incredible new map that just dropped" does not — nobody reads that at speed.',
          '<b>Top third of the frame,</b> bold, white on a dark bar. The bottom 15% is covered by the app\u2019s interface and the caption overlay.',
          '<b>Assume no audio.</b> A large share of viewers watch muted. If the clip only makes sense with sound, it does not work.',
          '<b>Burn the text in before uploading.</b> Adding it inside the app is faster but you will redo it per platform and the two versions will drift. One export, two uploads.',
          '<b>Text overlay is not the caption.</b> Overlay is for the eye, the caption field is for the tag and the disclosure, and the campaign checks the caption.'
        ],
        drill: 'Take your best clip. Make three versions with three different hooks: a claim, a question, a number. Post them a day apart on the same account and note which retained attention.',
        warn: 'Do not put the hook over the most important visual moment. The text should frame the shot, not cover it.',
        source: 'Primal and Luka (the hook is the visual plus the text plus the first second, treated as one unit).'
      },
      {
        id: 'l14',
        title: 'Captions, audio and disclosure',
        goal: 'Meet the campaign\u2019s requirements without making the post look like an ad break.',
        steps: [
          '<b>Caption is original and specific.</b> Write what is actually in the clip. "The lighting in new DMZ is unreal" beats "🔥🔥🔥" and beats any generic line a reviewer has seen on 40 other submissions.',
          '<b>Disclosure goes in the caption, visibly.</b> For these campaigns that means <span class="mono">#Ad</span>. It is a legal requirement in most markets and a campaign requirement in all of them.',
          '<b>Tag the account the campaign names,</b> spelled exactly, on every platform. Check after posting that it rendered as a real mention — on some web uploaders it does not autocomplete and stays as plain text.',
          '<b>Keep the original audio.</b> Replace it only when the campaign allows it. Original audio usually carries the game or the voice that makes the clip worth watching.',

Not as evidence that clipping works. As a reminder of how much of the information circulating about it is marketing. When you read the next thread, look for the link at the bottom first, then decide how much of the middle to believe.</div>
`;

let S = load();
function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }

const ALL = [];
MODULES.forEach((m,mi)=>m.lessons.forEach(l=>ALL.push({...l, mod:mi})));
const TOTAL = ALL.length;

function isDone(id){ return !!S[id]; }

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  MODULES.forEach(m=>{
    const h = document.createElement('div');
    h.className = 'mod'; h.textContent = m.title;
    nav.appendChild(h);
    m.lessons.forEach(l=>{
      const b = document.createElement('button');
      b.className = 'navbtn' + (isDone(l.id)?' done':'');
      b.textContent = l.title;
      b.dataset.go = l.id;
      nav.appendChild(b);
    });
  });
  const h = document.createElement('div');
  h.className = 'mod'; h.textContent = 'Appendices';
  nav.appendChild(h);
  EXTRAS.forEach(x=>{
    const b = document.createElement('button');
    b.className = 'navbtn';
    b.textContent = x.nav;
    b.dataset.go = x.id;
    nav.appendChild(b);
  });
  nav.querySelectorAll('[data-go]').forEach(b=>{
    b.addEventListener('click',()=>location.hash = b.dataset.go);
  });
  const done = ALL.filter(l=>isDone(l.id)).length;
  document.getElementById('pbar').style.width = (done/TOTAL*100)+'%';
  document.getElementById('ptxt').textContent = done + ' of ' + TOTAL + ' complete';
}

function renderLesson(l){
  const m = MODULES[l.mod];
  const main = document.getElementById('main');
  const idx = ALL.findIndex(x=>x.id===l.id);
  const prev = ALL[idx-1], next = ALL[idx+1];
  main.innerHTML = `
    <div class="crumb">${m.title.replace(/^Module \d+ · /,'')} · Lesson ${idx+1} of ${TOTAL}</div>
    <h2>${l.title}</h2>
    <div class="goal">${l.goal}</div>
    <h3>What to actually do</h3>
    <ol class="steps">${l.steps.map(s=>'<li>'+s+'</li>').join('')}</ol>
    <div class="box drill"><span class="lbl">Drill</span>${l.drill}</div>
    ${l.warn ? `<div class="box warnbox"><span class="lbl">Watch out</span>${l.warn}</div>` : ''}
    <div class="src">Source: ${l.source}</div>
    <div class="row">
      <button class="btn ${isDone(l.id)?'done':''}" id="mark">${isDone(l.id)?'Completed ✓':'Mark complete'}</button>
      ${prev?`<button class="ghost" id="prev">← ${prev.title}</button>`:''}
      ${next?`<button class="ghost" id="next">${next.title} →</button>`:`<button class="ghost" id="next">Appendix →</button>`}
    </div>`;
  document.getElementById('mark').addEventListener('click',()=>{
    S[l.id] = !S[l.id]; save(); renderNav(); renderLesson(l);
  });
  const p = document.getElementById('prev'), n = document.getElementById('next');
  if(p) p.addEventListener('click',()=>location.hash = prev.id);
  if(n) n.addEventListener('click',()=>location.hash = next ? next.id : 'cut');
}

function renderExtra(id){
  const main = document.getElementById('main');
  main.innerHTML = (id==='cut'?CUT:SOURCES) + `
    <div class="row">
      <button class="ghost" id="back">← Back to lesson 30</button>
    </div>`;
  document.getElementById('back').addEventListener('click',()=>location.hash = 'l30');
}

function route(){
  const id = (location.hash||'').replace('#','') || 'l1';
  document.querySelectorAll('.navbtn').forEach(b=>
    b.classList.toggle('on', b.dataset.go===id));
  if(id==='cut'||id==='sources'){ renderExtra(id); }
  else {
    const l = ALL.find(x=>x.id===id) || ALL[0];
    renderLesson(l);
    const active = document.querySelector('.navbtn.on');
    if(active && window.innerWidth<=820) active.scrollIntoView({block:'nearest'});
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);
renderNav();
route();
</script>
